<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./styles.css" />
    <!-- Runs the React code below without a build step. -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import * as zebar from 'https://esm.sh/zebar@3.3.1';

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        systray: { type: 'systray' },
        audio: { type: 'audio' },
        media: { type: 'media' },
        network: { type: 'network' },
        battery: { type: 'battery' },
        cpu: { type: 'cpu' },
        memory: { type: 'memory' },
        weather: { type: 'weather' },
        date: { type: 'date', formatting: 'EEE d MMM  t' },
      });

      // Must match the shellCommands privileges in zpack.json exactly.
      const PS = ['-NoProfile', '-NonInteractive', '-EncodedCommand'];
      // (New-Object -ComObject WScript.Shell).SendKeys('^{ESC}')
      const OPEN_START = 'KABOAGUAdwAtAE8AYgBqAGUAYwB0ACAALQBDAG8AbQBPAGIAagBlAGMAdAAgAFcAUwBjAHIAaQBwAHQALgBTAGgAZQBsAGwAKQAuAFMAZQBuAGQASwBlAHkAcwAoACcAXgB7AEUAUwBDAH0AJwApAA==';
      // Add-Type -AssemblyName System.Windows.Forms; [void][System.Windows.Forms.Application]::SetSuspendState('Suspend', $false, $false)
      const SLEEP = 'QQBkAGQALQBUAHkAcABlACAALQBBAHMAcwBlAG0AYgBsAHkATgBhAG0AZQAgAFMAeQBzAHQAZQBtAC4AVwBpAG4AZABvAHcAcwAuAEYAbwByAG0AcwA7ACAAWwB2AG8AaQBkAF0AWwBTAHkAcwB0AGUAbQAuAFcAaQBuAGQAbwB3AHMALgBGAG8AcgBtAHMALgBBAHAAcABsAGkAYwBhAHQAaQBvAG4AXQA6ADoAUwBlAHQAUwB1AHMAcABlAG4AZABTAHQAYQB0AGUAKAAnAFMAdQBzAHAAZQBuAGQAJwAsACAAJABmAGEAbABzAGUALAAgACQAZgBhAGwAcwBlACkA';

      const run = (program, args) => zebar.shellExec(program, args).catch(err => console.error(err));

      // Lock and Sleep act at once; the rest need a second click within 4 seconds.
      const POWER = [
        { id: 'lock', icon: 'nf-md-lock', label: 'Lock', act: () => run('rundll32', 'user32.dll,LockWorkStation') },
        { id: 'sleep', icon: 'nf-md-sleep', label: 'Sleep', act: () => run('powershell', [...PS, SLEEP]) },
        { id: 'logout', icon: 'nf-md-logout', label: 'Sign out', confirm: true, act: () => run('shutdown', ['/l']) },
        { id: 'restart', icon: 'nf-md-restart', label: 'Restart', confirm: true, act: () => run('shutdown', ['/r', '/t', '0']) },
        { id: 'shutdown', icon: 'nf-md-power', label: 'Shut down', confirm: true, act: () => run('shutdown', ['/s', '/t', '0']) },
      ];

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        const [out, setOut] = useState(providers.outputMap);
        useEffect(() => {
          providers.onOutput(() => setOut(providers.outputMap));
        }, []);
        const { glazewm, systray, audio, media, network, battery, cpu, memory, weather, date } = out;

        return (
          <div className="bar">
            <div className="left">
              <button className="mod start" title="Start" onClick={() => run('powershell', [...PS, OPEN_START])}>
                <i className="nf nf-fa-windows"></i>
              </button>
              {glazewm && <Workspaces glazewm={glazewm} />}
              {glazewm?.focusedContainer?.type === 'window' && (
                <div className="mod title">{glazewm.focusedContainer.title}</div>
              )}
            </div>

            <div className="center">
              {date && <div className="mod clock">{date.formatted}</div>}
            </div>

            <div className="right">
              {media?.currentSession && <Media media={media} />}
              {weather && (
                <div className="mod">
                  <i className={`nf ${weatherIcon(weather.status)}`}></i>
                  {Math.round(weather.celsiusTemp)}°C
                </div>
              )}
              {cpu && memory && (
                <div className="mod">
                  <i className="nf nf-oct-cpu"></i>
                  <span className={cpu.usage > 85 ? 'warn' : ''}>{Math.round(cpu.usage)}%</span>
                  <i className="nf nf-fae-chip"></i>
                  {Math.round(memory.usage)}%
                </div>
              )}
              {network && (
                <div className="mod" title={network.defaultGateway?.ssid ?? ''}>
                  <i className={`nf ${networkIcon(network)}`}></i>
                </div>
              )}
              {audio?.defaultPlaybackDevice && <Volume audio={audio} />}
              {battery && (
                <div className="mod">
                  <i className={`nf ${battery.isCharging ? 'nf-md-battery_charging' : batteryIcon(battery.chargePercent)}`}></i>
                  {Math.round(battery.chargePercent)}%
                </div>
              )}
              {systray?.icons.length > 0 && <Tray systray={systray} />}
              <Power />
            </div>
          </div>
        );
      }

      function Workspaces({ glazewm }) {
        return (
          <div className="mod workspaces">
            {glazewm.currentWorkspaces.map(ws => (
              <button
                key={ws.name}
                className={`ws ${ws.hasFocus ? 'focused' : ''} ${ws.isDisplayed ? 'displayed' : ''}`}
                onClick={() => glazewm.runCommand(`focus --workspace ${ws.name}`)}
              >
                {ws.displayName ?? ws.name}
              </button>
            ))}
            {glazewm.isPaused && (
              <button className="ws paused" onClick={() => glazewm.runCommand('wm-toggle-pause')}>paused</button>
            )}
          </div>
        );
      }

      function Media({ media }) {
        const s = media.currentSession;
        return (
          <div className="mod media">
            <button onClick={() => media.previous()} disabled={!s.isPreviousEnabled}><i className="nf nf-md-skip_previous"></i></button>
            <button onClick={() => media.togglePlayPause()}><i className={`nf ${s.isPlaying ? 'nf-md-pause' : 'nf-md-play'}`}></i></button>
            <button onClick={() => media.next()} disabled={!s.isNextEnabled}><i className="nf nf-md-skip_next"></i></button>
            <span className="track">{[s.title, s.artist].filter(Boolean).join(' · ')}</span>
          </div>
        );
      }

      function Volume({ audio }) {
        const dev = audio.defaultPlaybackDevice;
        const icon = dev.isMuted || dev.volume === 0 ? 'nf-md-volume_off'
          : dev.volume < 34 ? 'nf-md-volume_low'
          : dev.volume < 67 ? 'nf-md-volume_medium' : 'nf-md-volume_high';
        return (
          <button
            className="mod"
            title={`${dev.name} (scroll to change)`}
            onClick={() => audio.setMute(!dev.isMuted)}
            onWheel={e => audio.setVolume(Math.min(100, Math.max(0, dev.volume + (e.deltaY < 0 ? 5 : -5))))}
          >
            <i className={`nf ${icon}`}></i>
            {Math.round(dev.volume)}%
          </button>
        );
      }

      function Tray({ systray }) {
        return (
          <div className="mod tray">
            {systray.icons.map(icon => (
              <img
                key={icon.id}
                src={icon.iconUrl}
                title={icon.tooltip}
                onClick={e => { e.preventDefault(); systray.onLeftClick(icon.id); }}
                onDoubleClick={e => { e.preventDefault(); systray.onLeftDoubleClick(icon.id); }}
                onContextMenu={e => { e.preventDefault(); systray.onRightClick(icon.id); }}
                onAuxClick={e => { if (e.button === 1) systray.onMiddleClick(icon.id); }}
                onMouseEnter={() => systray.onHoverEnter(icon.id)}
                onMouseLeave={() => systray.onHoverLeave(icon.id)}
                onMouseMove={() => systray.onHoverMove(icon.id)}
              />
            ))}
          </div>
        );
      }

      function Power() {
        const [open, setOpen] = useState(false);
        const [armed, setArmed] = useState(null);
        const timer = useRef();
        useEffect(() => () => clearTimeout(timer.current), []);

        function click(item) {
          if (item.confirm && armed !== item.id) {
            setArmed(item.id);
            clearTimeout(timer.current);
            timer.current = setTimeout(() => setArmed(null), 4000);
            return;
          }
          setArmed(null);
          setOpen(false);
          item.act();
        }

        return (
          <div className="mod power">
            {open && POWER.map(item => (
              <button
                key={item.id}
                className={armed === item.id ? 'armed' : ''}
                title={item.label}
                onClick={() => click(item)}
              >
                <i className={`nf ${item.icon}`}></i>
                {armed === item.id && <span>{item.label}?</span>}
              </button>
            ))}
            <button title="Power" onClick={() => { setOpen(!open); setArmed(null); }}>
              <i className={`nf ${open ? 'nf-md-close' : 'nf-md-power'}`}></i>
            </button>
          </div>
        );
      }

      function networkIcon(net) {
        const type = net.defaultInterface?.type;
        if (type === 'ethernet') return 'nf-md-ethernet_cable';
        if (type === 'proprietary_virtual') return 'nf-md-shield_lock_outline';
        if (type !== 'wifi') return 'nf-md-wifi_strength_off_outline';
        const s = net.defaultGateway?.signalStrength ?? 0;
        return s >= 80 ? 'nf-md-wifi_strength_4' : s >= 65 ? 'nf-md-wifi_strength_3'
          : s >= 40 ? 'nf-md-wifi_strength_2' : s >= 25 ? 'nf-md-wifi_strength_1' : 'nf-md-wifi_strength_outline';
      }

      function batteryIcon(pct) {
        return pct > 90 ? 'nf-fa-battery_4' : pct > 70 ? 'nf-fa-battery_3'
          : pct > 40 ? 'nf-fa-battery_2' : pct > 20 ? 'nf-fa-battery_1' : 'nf-fa-battery_0';
      }

      function weatherIcon(status) {
        return {
          clear_day: 'nf-weather-day_sunny', clear_night: 'nf-weather-night_clear',
          cloudy_day: 'nf-weather-day_cloudy', cloudy_night: 'nf-weather-night_alt_cloudy',
          light_rain_day: 'nf-weather-day_sprinkle', light_rain_night: 'nf-weather-night_alt_sprinkle',
          heavy_rain_day: 'nf-weather-day_rain', heavy_rain_night: 'nf-weather-night_alt_rain',
          snow_day: 'nf-weather-day_snow', snow_night: 'nf-weather-night_alt_snow',
          thunder_day: 'nf-weather-day_lightning', thunder_night: 'nf-weather-night_alt_lightning',
        }[status] ?? 'nf-weather-na';
      }
    </script>
  </body>
</html>
