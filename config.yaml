# Hyprland-style keymap and look for GlazeWM (tested on v3.10.1).
# Based on GlazeWM's sample config:
# https://github.com/glzr-io/glazewm/blob/v3.10.1/resources/assets/sample-config.yaml
# Reload after editing: Win+Shift+R.

general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []

  # Hyprland `follow_mouse = 1`. Set to false to focus by click only.
  focus_follows_cursor: true

  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'

  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  # Hyprland `gaps_in = 5` is per window, so 10px between two windows.
  inner_gap: '10px'
  outer_gap:
    top: '4px'
    right: '4px'
    bottom: '4px'
    left: '4px'

window_effects:
  focused_window:
    # Windows 11 draws a 1px solid border; gradients and thickness are not supported.
    border:
      enabled: true
      color: '#0078d4'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '100%'

  other_windows:
    border:
      enabled: false
      color: '#a1a1a1'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    # Hyprland `inactive_opacity = 0.8`.
    transparency:
      enabled: true
      opacity: '80%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

# Not bound to monitors, so the same config works on any number of screens.
# To pin one, add `bind_to_monitor: N` (0 is the leftmost monitor).
workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'

# GlazeWM's default ignore rules, unchanged.
window_rules:
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

# Left to Windows on purpose: Win+L lock, Win+V clipboard, Win+A quick
# settings, Win+N notifications, Win+W widgets, Win+E Explorer, Win+R Run,
# Print (Snipping Tool) and media keys.
keybindings:
  # Focus
  - commands: ['focus --direction left']
    bindings: ['lwin+left']
  - commands: ['focus --direction right']
    bindings: ['lwin+right']
  - commands: ['focus --direction up']
    bindings: ['lwin+up']
  - commands: ['focus --direction down']
    bindings: ['lwin+down']

  # Workspaces
  - commands: ['focus --workspace 1']
    bindings: ['lwin+1']
  - commands: ['focus --workspace 2']
    bindings: ['lwin+2']
  - commands: ['focus --workspace 3']
    bindings: ['lwin+3']
  - commands: ['focus --workspace 4']
    bindings: ['lwin+4']
  - commands: ['focus --workspace 5']
    bindings: ['lwin+5']
  - commands: ['focus --workspace 6']
    bindings: ['lwin+6']
  - commands: ['move --workspace 1']
    bindings: ['lwin+shift+1']
  - commands: ['move --workspace 2']
    bindings: ['lwin+shift+2']
  - commands: ['move --workspace 3']
    bindings: ['lwin+shift+3']
  - commands: ['move --workspace 4']
    bindings: ['lwin+shift+4']
  - commands: ['move --workspace 5']
    bindings: ['lwin+shift+5']
  - commands: ['move --workspace 6']
    bindings: ['lwin+shift+6']

  # Window state
  - commands: ['close']
    bindings: ['lwin+c']
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+f']
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+j']
  - commands: ['toggle-fullscreen --maximized']
    bindings: ['lwin+shift+f']
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+ctrl+f']
  - commands: ['toggle-minimized']
    bindings: ['lwin+m', 'lwin+shift+m']

  # Apps
  - commands: ['shell-exec wt']
    bindings: ['lwin+q', 'ctrl+alt+t']
  - commands: ['shell-exec vivaldi']
    bindings: ['lwin+i']
  - commands: ['shell-exec zed']
    bindings: ['lwin+z']
  # Opens Start by sending Ctrl+Esc. Encoded so GlazeWM's argument parsing
  # cannot strip the quotes. Decodes to:
  # (New-Object -ComObject WScript.Shell).SendKeys('^{ESC}')
  - commands: ['shell-exec --hide-window powershell -NoProfile -NonInteractive -EncodedCommand KABOAGUAdwAtAE8AYgBqAGUAYwB0ACAALQBDAG8AbQBPAGIAagBlAGMAdAAgAFcAUwBjAHIAaQBwAHQALgBTAGgAZQBsAGwAKQAuAFMAZQBuAGQASwBlAHkAcwAoACcAXgB7AEUAUwBDAH0AJwApAA==']
    bindings: ['lwin+d']

  # GlazeWM
  - commands: ['wm-reload-config']
    bindings: ['lwin+shift+r']
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+shift+p']
  - commands: ['wm-exit']
    bindings: ['lwin+escape']
